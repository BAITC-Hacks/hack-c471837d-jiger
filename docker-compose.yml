services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount the directory so atomic replacements of products.json remain visible.
      - type: bind
        source: ./data
        target: /app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=5).close()"
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
